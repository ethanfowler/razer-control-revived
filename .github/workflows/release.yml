name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  APP_VERSION: "0.3.6"
  # The .deb carries this fork's power controls (CPU limits, turbo, GPU clocks)
  DEB_VERSION: "0.3.6+blade16.1"

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            rpm-build \
            cargo \
            rust \
            dbus-devel \
            libusb1-devel \
            hidapi-devel \
            gtk4-devel \
            libadwaita-devel \
            glib2-devel \
            graphene-devel \
            pango-devel \
            cairo-devel \
            gdk-pixbuf2-devel \
            systemd-devel \
            git

      - name: Setup rpmbuild structure
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          VERSION=$(grep '^Version:' packaging/fedora/razercontrol.spec | awk '{print $2}')
          SRCDIR="razercontrol-revived-${VERSION}"
          mkdir -p "$SRCDIR"
          cp -r . "$SRCDIR/" 2>/dev/null || true
          tar -czf ~/rpmbuild/SOURCES/razercontrol-revived-${VERSION}.tar.gz "$SRCDIR"

      - name: Build RPM
        run: rpmbuild -bb packaging/fedora/razercontrol.spec

      - name: Collect RPM
        run: |
          mkdir -p rpm-output
          find ~/rpmbuild/RPMS -name "*.rpm" ! -name "*-debuginfo-*" ! -name "*-debugsource-*" -exec cp {} rpm-output/ \;

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: rpm-output/*.rpm

  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libdbus-1-dev \
            libhidapi-dev \
            libusb-1.0-0-dev \
            libudev-dev \
            libglib2.0-dev \
            libgraphene-1.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libsystemd-dev \
            pkg-config \
            dpkg-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: razer_control_gui
        run: cargo build --release

      - name: Build .deb package
        run: packaging/debian/build-deb.sh "$DEB_VERSION"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: razercontrol-revived_*.deb

  check-nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Update flake inputs
        run: nix flake update

      - name: Build with Nix
        run: nix build --print-build-logs

  build-tarball:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libdbus-1-dev \
            libhidapi-dev \
            libusb-1.0-0-dev \
            libudev-dev \
            libglib2.0-dev \
            libgraphene-1.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libsystemd-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: razer_control_gui
        run: cargo build --release

      - name: Package tarball
        run: |
          DIST="razer-control-${APP_VERSION}-x86_64"
          mkdir -p $DIST/bin $DIST/share/applications $DIST/share/razercontrol $DIST/systemd $DIST/udev
          cp razer_control_gui/target/release/razer-settings $DIST/bin/
          cp razer_control_gui/target/release/razer-cli $DIST/bin/
          cp razer_control_gui/target/release/daemon $DIST/bin/
          cp razer_control_gui/data/gui/com.encomjp.razer-settings.desktop $DIST/share/applications/
          cp razer_control_gui/data/devices/laptops.json $DIST/share/razercontrol/
          cp razer_control_gui/data/services/systemd/razercontrol.service $DIST/systemd/
          cp razer_control_gui/data/udev/70-razercontrol-hidraw.rules $DIST/udev/
          cp release/razer-control-0.2.0-x86_64/install.sh $DIST/install.sh
          # Update version in copied install script
          sed -i "s/0\.2\.0/${APP_VERSION}/g" $DIST/install.sh
          chmod +x $DIST/install.sh
          cp LICENSE $DIST/
          cp README.md $DIST/
          tar -czvf "${DIST}.tar.gz" "$DIST"

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: razer-control-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    # Only the .deb packages razer-helper and its polkit policy, so it's the
    # one release asset; the other jobs still build as checks.
    needs: [build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: find artifacts -type f -ls

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/deb-package/*.deb
